[project]
name = "ciclo-estudos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Marcos Vinícius Silva", email = "marcoscv71@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.20.0",
  "fastapi[standard]>=0.141.1",
  "pwdlib[argon2]>=0.3.1",
  "pydantic-settings>=2.15.0",
  "pyjwt>=2.14.0",
  "sqlalchemy>=2.0.54",
  "tzdata>=2026.4",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "httpx2>=2.13.0",
  "poethepoet>=0.48.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-random-order>=1.2.0",
  "ruff>=0.16.8",
  "typos>=1.50.2",
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest]
addopts = [
  '-p',
  'no:warnings',
  '--cov=ciclo_estudos',
  '--cov-context=test',
  '--random-order',
]

[tool.typos.files]
extend-exclude = ['*.md']

[tool.poe.tasks]
lint = 'ruff check'
format.sequence = [{ cmd = 'ruff check --fix' }, { cmd = 'ruff format' }]
serve = 'fastapi dev src/ciclo_estudos/app.py'
test.sequence = [
  'lint',
  { cmd = 'pytest -s -x -vv $POE_EXTRA_ARGS' },
  { cmd = 'coverage html --show-contexts' },
]
seed = 'python scripts/seed.py'

[tool.coverage.run]
core = 'ctrace'

[tool.ruff.lint.per-file-ignores]
'tests/**' = ['PLR2004']
